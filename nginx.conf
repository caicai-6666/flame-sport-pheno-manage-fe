map $http_x_forwarded_proto $manage_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # 使用 Docker 内置 DNS 动态解析后端容器，支持后端容器独立重建后继续转发。
  resolver 127.0.0.11 valid=30s ipv6=off;

  # API 与页面共用 /flame/admin 前缀，浏览器无需感知容器内服务地址。
  location = /flame/admin/api {
    set $manage_backend http://manage-backend:8000;
    proxy_pass $manage_backend$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $manage_forwarded_proto;
  }

  location ^~ /flame/admin/api/ {
    set $manage_backend http://manage-backend:8000;
    proxy_pass $manage_backend$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $manage_forwarded_proto;
  }

  location = /flame/admin {
    return 301 /flame/admin/;
  }

  # Vite 资源名携带内容哈希，可长期缓存且不会污染后续版本。
  location ^~ /flame/admin/assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 页面刷新回退到当前入口；入口禁用缓存，确保每次部署都加载最新资源清单。
  location /flame/admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /flame/admin/index.html;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
}
